<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Sense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div class="ambient-glow glow-1" id="glow1"></div>
    <div class="ambient-glow glow-2" id="glow2"></div>

    <div class="app-wrapper">
        <header>
            <div class="logo">
                <div class="logo-icon"><i class="fa-solid fa-brain" style="font-size:15px"></i></div>
                <div class="logo-text">Emotion<span>Sense</span></div>
            </div>
            <div class="header-status">
                <div class="status-dot" id="status-dot" role="status" aria-label="Server status"></div>
                <span id="status-text">Checking...</span>
            </div>
        </header>

        <main>
            <section class="hero">
                <h1>Understand what's <br><span class="accent">beneath the words</span></h1>
                <p>Type any sentence and watch a BiGRU neural network decode the emotional undercurrent in real time.</p>
            </section>

            <section class="input-section" aria-label="Text input">
                <div class="input-card">
                    <div class="input-label">
                        <span>Your Text</span>
                        <span class="char-count" id="char-count">0 / 2000</span>
                    </div>
                    <textarea
                        id="text-input"
                        placeholder="I feel so happy and excited about what's coming next..."
                        maxlength="2000"
                        aria-label="Enter text for emotion analysis"
                    ></textarea>
                    <div class="input-actions">
                        <div class="sample-hints">
                            <button class="hint-chip" data-text="i can go from feeling so hopeless to so damned...	">Sadness</button>
                            <button class="hint-chip" data-text="Today was absolutely wonderful, I feel on top of the world">Joy</button>
                            <button class="hint-chip" data-text="i am ever feeling nostalgic about the fireplace...">Love</button>
                            <button class="hint-chip" data-text="This is completely unacceptable, I'm furious right now">Anger</button>
                            <button class="hint-chip" data-text="I heard something in the dark and my heart started racing">Fear</button>
                            <button class="hint-chip" data-text="i have seen heard and read over the past couple of days i am left feeling impressed by more than a few companies">Surprise</button>
                        </div>
                        <button class="predict-btn" id="predict-btn" disabled aria-label="Analyze emotion">
                            <div class="btn-spinner"></div>
                            <i class="fa-solid fa-arrow-right btn-icon"></i>
                            Analyze
                        </button>
                    </div>
                </div>
            </section>

            <section class="result-section" id="result-section" aria-label="Prediction result" aria-live="polite">
                <div class="emotion-display" id="emotion-display">
                    <div class="emotion-orb-container">
                        <div class="emotion-orb-ring"></div>
                        <div class="emotion-orb-ring"></div>
                        <div class="emotion-orb" id="emotion-orb"></div>
                    </div>
                    <div class="emotion-name" id="emotion-name"></div>
                    <div class="emotion-confidence" id="emotion-confidence"></div>
                    <div class="analyzed-text" id="analyzed-text"></div>
                </div>

                <div class="prob-section">
                    <div class="prob-header">Full Breakdown</div>
                    <div id="prob-bars"></div>
                </div>
            </section>
        </main>

        <footer>
            Built with BiGRU &middot; Powered by <span>FastAPI</span>
        </footer>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="toast-msg"></span>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
